name: 同步食材總表並更新網頁

on:
  schedule:
    - cron: "17 * * * *"   # 每小時一次
  workflow_dispatch:         # 可在 Actions 頁面手動執行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - name: 從 OneDrive 下載食材總表
        id: fetch
        continue-on-error: true
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: |
          set -o pipefail
          { date -u -d '+8 hours' '+%Y-%m-%d %H:%M（台北時間）'; } > sync-log.txt
          if [ -z "$ONEDRIVE_URL" ]; then echo "尚未設定 ONEDRIVE_URL" | tee -a sync-log.txt; exit 1; fi
          python3 tools/fetch_onedrive.py "$ONEDRIVE_URL" 食材總表.xlsx 2>&1 | tee -a sync-log.txt

      - name: 轉成網頁資料
        if: steps.fetch.outcome == 'success'
        run: python3 tools/convert.py 食材總表.xlsx data/ingredients.json

      - name: 下載失敗時沿用上次的資料
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::這次沒有抓到 OneDrive 的食材總表，網頁沿用 repository 裡的 data/ingredients.json"

      - name: 整理要發佈的檔案
        run: |
          mkdir -p _site
          cp -r index.html matcher.js data _site/
          [ -f sync-log.txt ] && cp sync-log.txt _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
